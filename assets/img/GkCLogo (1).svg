<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <style>
      .text-golfclub {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-size: 24px;
        font-weight: 600;
        fill: #1B4D3E;
        letter-spacing: 10px;
      }
      .text-centar {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-size: 42px;
        font-weight: 800;
        fill: #1B4D3E;
        letter-spacing: 6px;
      }
      .text-sweden {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-size: 18px;
        font-weight: 600;
        fill: #1B4D3E;
        letter-spacing: 10px;
      }
    </style>
    
    <!-- Båge för texten GOLFCLUB (sänkt för att undvika avklippning) -->
    <path id="textArc" d="M 100,180 A 150,150 0 0,1 400,180" fill="none" />
  </defs>

  <!-- Yttre tunn cirkel -->
  <circle cx="250" cy="270" r="135" fill="none" stroke="#1B4D3E" stroke-width="4" />

  <!-- Bokstaven 'C' (Grön båge) -->
  <path d="M 330,200 A 105,105 0 1,0 330,340" fill="none" stroke="#1B4D3E" stroke-width="26" stroke-linecap="round" />

  <!-- Peg (Guld/Mässing) -->
  <path d="M 243,310 L 257,310 L 254,355 L 246,355 Z" fill="#D4AF37" />
  <path d="M 238,302 C 242,308 258,308 262,302 L 260,310 L 240,310 Z" fill="#C29B27" />

  <!-- Golfboll (Guld/Mässing) -->
  <circle cx="250" cy="272" r="30" fill="#D4AF37" />
  
  <!-- Gropar på bollen -->
  <g fill="#B89223" opacity="0.6">
    <circle cx="242" cy="260" r="3" />
    <circle cx="254" cy="258" r="3" />
    <circle cx="264" cy="265" r="3" />
    <circle cx="236" cy="270" r="3" />
    <circle cx="248" cy="272" r="3.5" />
    <circle cx="260" cy="276" r="3" />
    <circle cx="242" cy="282" r="3" />
    <circle cx="254" cy="285" r="3" />
  </g>

  <!-- Text: GOLFCLUB -->
  <text class="text-golfclub">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      GOLFCLUB
    </textPath>
  </text>

  <!-- Text: CENTAR -->
  <text x="250" y="470" class="text-centar" text-anchor="middle">CENTAR</text>

  <!-- Text: SWEDEN -->
  <text x="250" y="510" class="text-sweden" text-anchor="middle">SWEDEN</text>
</svg>
